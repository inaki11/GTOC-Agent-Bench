[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gtoc-bench"
version = "0.1.0"
description = "Reproducible, isolated agent evaluations on GTOC problems"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "PyYAML==6.0.3", "PyJWT[crypto]==2.15.1"]

[project.optional-dependencies]
judge = ["numpy==2.2.6", "scipy==1.16.2"]
analysis = ["matplotlib==3.10.7"]

[project.scripts]
gtoc = "gtoc_bench.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2", "numpy==2.2.6", "scipy==1.16.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: integration tests requiring the built Linux amd64 image", "proxy: integration tests requiring the pinned local CLIProxyAPI binary", "slow: full submitted-trajectory numerical validation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
