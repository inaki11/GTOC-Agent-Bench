# local_address: "http://172.20.0.1:8000/v1" # maquinas mit vllm
local_address: "http://10.255.255.254:11434/v1" # ip wsl2 iñaki

vars:
  step_count: &step_count 5
  time_limit: &time_limit 7200 # 2 hrs

defaults: &defaults
  start: aide/start.sh
  dockerfile: aide/Dockerfile
  kwargs_type: omegaconf
  env_vars: &env_vars
    TIME_LIMIT_SECS: *time_limit
    STEP_LIMIT: *step_count

kwargs_common: &kwargs_common
  agent.search.max_debug_depth: 20 # debug down a branch for up to 6 steps
  agent.search.debug_prob: 1 # always debug when there's something to debug
  agent.search.num_drafts: 1 # implement 10 different initial solutions
  agent.time_limit: *time_limit
  exec.timeout: 600 # 10 minutes per code execution
  copy_data: False # use symbolic links

aide:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gemini-2.5-pro #local-qwen3:8b #o4-mini-2025-04-16  #gpt-5-2025-08-07  #gpt-4.1-mini-2025-04-14
    agent.feedback.model: gemini-2.5-flash #local-qwen3:8b #o4-mini-2025-04-16  #gpt-5-2025-08-07  #gpt-4.1-mini-2025-04-14
    agent.steps: *step_count
  env_vars:
    <<: *env_vars
    OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

aide/dev:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gpt-4.1-nano-2025-04-14
    agent.feedback.model: gpt-4.1-nano-2025-04-14
    agent.steps: 8
  env_vars:
    <<: *env_vars
    OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

aide/o1-preview:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: o1-preview
    agent.code.temp: 1
    agent.feedback.model: gpt-4o-2024-08-06
    agent.steps: *step_count
    agent.convert_system_to_user: True
  env_vars:
    <<: *env_vars
    OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

