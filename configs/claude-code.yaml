schema_version: 1
purpose: development
problem: gtoc12
agent:
  id: claude_code
  version: 2.1.308
model:
  id: claude-sonnet-4-6
  reasoning: high
  max_output_tokens: 16384
provider:
  id: anthropic
  protocol: anthropic
  base_url: https://api.anthropic.com/v1
  env_file: ~/.config/gtoc-bench/providers/anthropic.env
  api_key_variable: ANTHROPIC_API_KEY
environment:
  image: auto
hardware:
  gpus: auto
  workspace_gb: 8
budget:
  wall_seconds: 3600
  token_limit: 1000000
recovery:
  clock_policy: provider_wait
  max_transient_retries: 2
  max_retry_wait_seconds: 120
