schema_version: 1
purpose: development
problem: gtoc12
agent:
  id: antigravity
  version: 0.1.23
model:
  # Copy an exact ID (Gemini, Claude, or another advertised model) from:
  # gtoc auth models antigravity
  id: REPLACE_WITH_MODEL_ID_FROM_CATALOG
  reasoning: high
provider:
  id: antigravity
  protocol: chat_completions
  base_url: http://127.0.0.1:8317/v1
  auth_method: antigravity
  profile: default
  auth_dir: ~/.config/gtoc-bench/antigravity
  timeouts:
    connect_seconds: 10
    read_seconds: 300
    attempt_seconds: 1800
  keepalive_seconds: 15
environment:
  image: auto
hardware:
  gpus: auto
  workspace_gb: 8
budget:
  wall_seconds: 3600
  token_limit: null
