schema_version: 1
purpose: development
problem: gtoc12
agent:
  id: openhands
  version: 1.16.0
model:
  id: gpt-5.4
  reasoning: high
  max_output_tokens: 16384
provider:
  id: openai
  protocol: responses
  base_url: https://api.openai.com/v1
  env_file: ~/.config/gtoc-bench/providers/openai.env
  api_key_variable: OPENAI_API_KEY
  auth_method: api_key
environment:
  image: auto
hardware:
  gpus: auto
  workspace_gb: 8
budget:
  wall_seconds: 3600
  token_limit: 1000000
recovery:
  clock_policy: provider_wait
  max_transient_retries: 2
  max_retry_wait_seconds: 120
