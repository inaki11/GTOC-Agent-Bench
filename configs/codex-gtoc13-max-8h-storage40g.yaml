# Bounded disk profile for a shared 40 GiB account; peers must be declared explicitly.
schema_version: 1
purpose: development
problem: gtoc13
agent:
  id: codex
  version: 0.164.0
model:
  id: gpt-6.1-sol
  reasoning: max
provider:
  id: openai
  protocol: responses
  base_url: https://api.openai.com/v1
  auth_method: chatgpt
  profile: default
  auth_dir: ~/.config/gtoc-bench/auth
environment:
  image: gtoc-bench:storage-20261104
hardware:
  cpus: 20
  memory_gb: 96
  gpus: none
  workspace_gb: 4
storage:
  audit_reserve_gb: 2
  minimum_free_gb: 2
budget:
  wall_seconds: 28800
  token_limit: null
recovery:
  clock_policy: provider_wait
  max_transient_retries: 2
  max_retry_wait_seconds: 120
  provider_retry_interval_seconds: 300
  provider_wait_seconds: 3600
